<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJ评测记录管理器</title>
  <style>
:root{
    --bg:#121212;
    --panel:#1e1e1e;
    --card:#27272a;
    --text:#eee;
    --text2:#aaa;
    --border:#444;
    --primary:#2563eb;
    --danger:#dc2626;
    --success:#16a34a;
    --warn:#f59e0b;
    --tagbg:#334155;
    --feature-tag-bg:#475569;
}
.light{
    --bg:#ffffff;
    --panel:#f3f4f6;
    --card:#e5e7eb;
    --text:#111;
    --text2:#666;
    --border:#ccc;
    --primary:#2563eb;
    --danger:#dc2626;
    --success:#16a34a;
    --warn:#f59e0b;
    --tagbg:#dbeafe;
    --feature-tag-bg:#e0e7ff;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:var(--bg);color:var(--text);padding:14px;max-width:1400px;margin:0 auto;transition:0.2s}
h1,h2,h3{margin:12px 0;color:var(--text)}
.container{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:960px){.container{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;margin:8px 0 4px;color:var(--text2);font-size:14px}
input,textarea,select{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px}
button{padding:9px 14px;border:none;border-radius:6px;background:var(--primary);color:#fff;cursor:pointer;margin:4px;font-size:14px}
button:hover{filter:brightness(1.1)}
button.danger{background:var(--danger)}
button.success{background:var(--success)}
button.warn{background:var(--warn)}
.flex-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tag{display:inline-block;background:var(--tagbg);padding:3px 8px;border-radius:4px;margin:2px;font-size:12px}
.feature-tag{display:inline-block;background:var(--feature-tag-bg);padding:3px 8px;border-radius:4px;margin:2px;font-size:12px}
.tag-del{cursor:pointer;margin-left:4px;color:#f87171}
.record-item{background:var(--card);padding:10px;border-radius:8px;margin:8px 0;border-left:4px solid #666}
.status-AC{border-left-color:#22c55e}
.status-WA,.status-PC,.status-RE,.status-CE,.status-PE,.status-OLE,.status-MLE,.status-TLE,.status-UKE{border-left-color:#ef4444}
.mark-wrong{border-left-color:#ef4444!important}
.mark-suspect{border-left-color:#f59e0b!important}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.heatmap{display:grid;grid-template-columns:repeat(53,12px);gap:2px;flex-wrap:wrap}
.heat-cell{width:12px;height:12px;border-radius:2px;background:#444}
.light .heat-cell{background:#ddd}
.heat-1{background:#166534}.heat-2{background:#15803d}.heat-3{background:#16a34a}.heat-4{background:#22c55e}.heat-5{background:#4ade80}
.light .heat-1{background:#86efac}.light .heat-2{background:#4ade80}.light .heat-3{background:#22c55e}.light .heat-4{background:#16a34a}.light .heat-5{background:#14532d}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:8px 12px;background:var(--card);border-radius:6px;cursor:pointer}
.tab.active{background:var(--primary)}
.hidden{display:none}
small{color:var(--text2);font-size:12px}
textarea{min-height:80px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:99}
.modal.show{display:flex}
.modal-content{background:var(--panel);padding:20px;border-radius:10px;width:90%;max-width:700px;max-height:85vh;overflow:auto}
.test-grid{display:grid;grid-template-columns:repeat(20, 24px);gap:3px}
.test-cell{width:24px;height:24px;border-radius:3px;cursor:pointer;text-align:center;font-size:11px;color:#fff}
.t-ac{background:#22c55e}
.t-wa{background:#ef4444}
.t-unk{background:#555}
.latex-block{overflow-x:auto;padding:8px;margin:6px 0;background:var(--bg);border-radius:6px}
.solution-item{border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0}
.solution-title{font-weight:bold;margin-bottom:6px}
.solution-ctrl{margin-top:6px}
.markdown-render{line-height:1.6}
.markdown-render h1{font-size:22px;margin:8px 0}
.markdown-render h2{font-size:20px;margin:8px 0}
.markdown-render h3{font-size:18px;margin:8px 0}
.markdown-render pre{background:var(--bg);padding:8px;border-radius:6px;overflow-x:auto}
.markdown-render code{font-family:monospace}
.markdown-render blockquote{border-left:3px solid var(--primary);padding-left:8px;color:var(--text2)}
</style>
  <!-- Markdown + LaTeX 渲染依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
 </head>
 <body>
  <div class="flex-row" style="justify-content:space-between;align-items:center">
   <h1>OJ评测记录管理器</h1>
   <button id="toggleTheme">🌓 切换深浅色</button>
  </div>
  <div class="container">
   <div class="left">
    <div class="panel">
     <div class="tabs">
      <div class="tab active" data-tab="manual">手动录入</div>
      <div class="tab" data-tab="url">URL导入</div>
     </div>
     <div id="tab-manual">
      <label>题目标题</label> <input id="title" placeholder="例如：843. n皇后"> <label>题目链接URL</label> <input id="problemUrl" placeholder="https://..."> <label>题面（支持Markdown+LaTeX）</label> <textarea id="desc" placeholder="粘贴题面，支持 $E=mc^2$ 以及Markdown语法"></textarea> <label>时间复杂度（自定义）</label> <input id="timeComplex" placeholder="例如 O(n log n)、O(2^n)、O(n^2)">
      <div class="grid-3">
       <div>
        <label>难度文字</label> <select id="diffText"> <option value="">未设置</option> <option>简单</option><option>中等</option><option>困难</option><option>入门</option><option>普及-</option><option>普及</option><option>普及+/提高-</option><option>提高</option><option>提高+/省选-</option><option>省选/NOI-</option><option>NOI/NOI+/CTS</option><option>其他</option> </select>

       <div>
        <label>难度数值（0~5000整数）</label> <input id="diffVal" type="number" min="0" max="5000" step="1" placeholder="0-5000">
       </div>

      </div>
      <div class="grid-2">

        <label>标记类型</label> <select id="markType"> <option value="normal">普通</option> <option value="wrong">错题</option> <option value="suspect">疑似错题</option> </select>

      </div>

       <button onclick="appendFeatureTag()">添加特点标签</button>

      <div class="flex-row" style="margin-top:10px">

      <div class="flex-row" style="margin-top:10px">
       <button onclick="fetchUrlResult()">🔗 导入URL评测结果</button>
      </div>
      <div id="urlImportMsg" style="margin-top:10px"></div>

    </div>
    <div class="panel">
     <h3>💾 数据管理</h3>
     <div class="flex-row">
      <button onclick="exportData()">导出JSON</button>
      <button onclick="document.getElementById('importFile').click()">导入JSON</button>
      <input type="file" id="importFile" accept=".json" hidden onchange="importData(this)">
      <button onclick="migrateLocalStorage()">迁移旧LocalStorage</button>

     <h3 style="margin-top:12px">🏷️ 自定义平台/比赛</h3>
     <div class="flex-row">
      <input id="newPlatform" placeholder="新增平台名称">
      <button onclick="addCustomPlatform()">添加</button>

    </div>
    <div class="panel">

     <div class="grid-2">
      <select id="filterPlatform"><option value="">全部平台</option></select> <select id="filterStatus"><option value="">全部状态</option></select>
     </div>
     <div class="grid-2">
      <select id="filterTag"><option value="">全部算法标签</option></select> <select id="filterFeatureTag"><option value="">全部特点标签</option></select>
     </div>

     </div>

   </div>
   <div class="right">
    <div class="panel">

      <div class="tab active" data-view="records">记录列表</div>
      <div class="tab" data-view="stats">统计 &amp; 占比</div>

      <div class="tab" data-view="wrong">错题/疑似错题</div>
      <div class="tab" data-view="solution">题解管理</div>
     </div>
     <div id="view-records">
      <div id="recordList"></div>
     </div>

      <div id="statStatus"></div>
      <h3 style="margin-top:12px">🏷️ 算法标签统计</h3>
      <div id="statTag"></div>
      <h3 style="margin-top:12px">✨ 题目特点标签统计</h3>
      <div id="statFeatureTag"></div>

      <div id="statPlatform"></div>
     </div>

      <h3>🔥 提交热力图（近一年）</h3>
      <div id="heatmapBox" class="heatmap"></div>

     </div>

      <div id="solPanel"></div>
     </div>
    </div>
   </div>
  </div>

  <script>
// ========== 算法标签池（原标签，特点标签拆分出去） ==========

    "树","二叉树","并查集","树状数组BIT","线段树","主席树","可持久化线段树","堆","优先队列","单调栈","单调队列","分块","莫队","根号分治","平衡树","Treap","Splay","SqrtTree","跳跃表",
    "图论","Dijkstra","Bellman-Ford","SPFA","Floyd","最小生成树Prim","Kruskal","拓扑排序","强连通分量Tarjan","Kosaraju","双连通分量","LCA","树上差分","欧拉回路","哈密顿回路","二分图","匈牙利算法","KM算法","网络流","最大流","最小割","费用流","2-SAT","重链剖分","点分治","边分治",
    "KMP","Z函数","字符串哈希","Rabin-Karp","字典树Trie","AC自动机","SAM后缀自动机","广义SAM","后缀数组SA","后缀树","后缀平衡树","Manacher","回文自动机PAM","Lyndon分解","最小表示法","Boyer-Moore","有限状态自动机DFA/NFA","序列自动机",
    "数论","gcd/exgcd","快速幂","欧拉函数","费马小定理","逆元","质因数分解","筛法","MillerRabin","PollardRho","离散对数","原根","卢卡斯定理","中国剩余定理CRT",
    "组合数学","容斥原理","Catalan数","Stirling数","Burnside","Polya","母函数","二项式定理","鸽巢原理","博弈论","Nim","SG函数",
    "计算几何","凸包","半平面交","极角排序","最近点对","最小圆覆盖","Pick定理",
    "多项式","FFT","NTT","BM线性递推","高斯消元","矩阵快速幂","行列式",
    "其他"
];
// ========== 独立：题目特点标签 ==========
const FEATURE_TAG_PRESET = [
    "错题本","老题","新题","疑似错题","新考法","变式题","原创题目","错题","过时题目","卡常","原错题本题目","爆0","每日一题","随机抽题","检测出题","可能题目","考前预测","对应训练","压轴题目","押中题目","近义题目","思维题","求证题","固定答案题目","题面为答案的题目","水题","作业","占位符类题目","拟发布题目","未定义"

const STATUS_MAP = {
    "AC":["AC","ACCEPT","ACCEPTED"],
    "WA":["WA","WRONGANSWER","UNACCEPTED"],
    "RE":["RE","RUNTIMEERROR","RUNTIMEERROR"],
    "CE":["CE","COMPILEDERROR","COMPILATIONERROR","COMPILEERROR"],

const STATUS_NAME = {
    AC:"通过",WA:"答案错误",RE:"运行时失败",CE:"编译错误",PE:"格式错误",

// ========== 全新补全平台/比赛内置列表（按需求完整录入） ==========
const BUILTIN_PLATFORMS = [

    "校园专用OJ","集训队专用OJ","自行组建的OJ","Long Long OJ（已关停）","Sleeping Cup","Ynoi","POI","eJOI","CEOI","JOI","COCI","AGM","ROIR","COI","NOISG","NordicOI","PA","BalticOI","ROI","KOI","EGOI","BalkanOI","INOI","UOI","JOISC及JOIST","COTS","Moscow Olympiad","KTSC","MCC及MCO","IATI",

    "自行比拼","企业内能力检测","其他能力检测","能力筛选","随机抽题","网题","CSDN","博客园",
 	"初中活动","小学活动","校内测评","题目存档站","其他OJ","其他","未定","已关停站点","老OJ"
];

// ========== IndexedDB ==========
let db = null;
const DB_NAME = "OJRecordDB";
const DB_VERSION = 1;
const STORE_RECORDS = "records";
const STORE_META = "meta";
async function openDB(){
    return new Promise((resolve,reject)=>{
        const req = indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=e=>{
            const d=e.target.result;
            if(!d.objectStoreNames.contains(STORE_RECORDS)) d.createObjectStore(STORE_RECORDS,{keyPath:"id"});
            if(!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META,{keyPath:"key"});
        }
        req.onsuccess=e=>{db=e.target.result;resolve(db)};
        req.onerror=e=>reject(e.target.error);
    })
}
async function getAllRecords(){const tx=db.transaction(STORE_RECORDS,"readonly");return getAllFromStore(tx.objectStore(STORE_RECORDS))}
async function putRecord(item){const tx=db.transaction(STORE_RECORDS,"readwrite");await tx.objectStore(STORE_RECORDS).put(item)}
async function delRecordById(id){const tx=db.transaction(STORE_RECORDS,"readwrite");await tx.objectStore(STORE_RECORDS).delete(id)}
async function clearRecordStore(){const tx=db.transaction(STORE_RECORDS,"readwrite");await tx.objectStore(STORE_RECORDS).clear()}
async function getMeta(key){const tx=db.transaction(STORE_META,"readonly");const r=await tx.objectStore(STORE_META).get(key);return r?.value??null}
async function setMeta(key,value){const tx=db.transaction(STORE_META,"readwrite");await tx.objectStore(STORE_META).put({key,value})}
async function getAllFromStore(store){return new Promise((res,rej)=>{const req=store.getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}

// ========== 全局变量 ==========
let records = [];
let customPlatforms = [];
let currentTestRecordId = null;
let testState = [];
let testHistory = [];
const TEST_COUNT_DEFAULT = 200;
let renderLock = false; // 防重入锁，解决高频点击/滑动反复渲染卡死抖动

// ========== Markdown + LaTeX 渲染函数 ==========
function renderMdLatex(raw){
    if(!raw) return "";
    let html = marked.parse(raw);
    html = html.replace(/\$([^\$]+)\$/g, (m, g) => {
        try { return katex.renderToString(g, {throwOnError:false}) } catch { return m; }
    });
    html = html.replace(/\$\$([^\$]+)\$\$/g, (m, g) => {
        try { return `<div class="latex-block">${katex.renderToString(g, {throwOnError:false,displayMode:true})}</div>` } catch { return m; }
    });
    return `<div class="markdown-render">${html}</div>`;
}

async function fetchUrlResult(){
	const url = document.getElementById("importUrl").value.trim();
	const msgBox = document.getElementById("urlImportMsg");
	msgBox.textContent="";
	if(!url) return msgBox.textContent="请输入URL";

	// 新增：拦截洛谷域名
	try {
		const u = new URL(url);
		if (u.hostname === "www.luogu.com" || u.hostname === "www.luogu.com.cn") {
			msgBox.textContent = "拒绝请求：根据洛谷相关协议，暂时停止对洛谷评测记录的URL导入服务。";
			return;
		}
	} catch (_) {
		// 不是合法URL，继续走原有逻辑
	}

	try{
		const res = await fetch(url);
		if(!res.ok){
			msgBox.textContent = `请求失败，HTTP码：${res.status} ${res.statusText}`;
			return;
		}
		msgBox.textContent = `请求成功 HTTP ${res.status}；本程序无自动解析器，请手动录入评测信息`;
	}catch(e){
		msgBox.textContent = `网络异常：${e.message}`;
	}
}

function renderStats(){
    const stCnt = {};
    Object.keys(STATUS_MAP).forEach(k=>stCnt[k]=0);
    records.forEach(r=>stCnt[r.status]++);
    const total = records.length;
    let stHtml = "";
    Object.entries(stCnt).forEach(([k,v])=>{
        const pct = total ? (v/total*100).toFixed(1) : 0;
        stHtml += `<div class="stat-row"><span>${k} ${STATUS_NAME[k]}</span><span>${v}条 (${pct}%)</span></div>`;
    })
    document.getElementById("statStatus").innerHTML = stHtml;
    const tagCnt = {};
    const ftagCnt = {};
    records.forEach(r=>{
        (r.tags||[]).forEach(t=>tagCnt[t]=(tagCnt[t]||0)+1);
        (r.featureTags||[]).forEach(t=>ftagCnt[t]=(ftagCnt[t]||0)+1);
    });
    let tagHtml = "";
    Object.entries(tagCnt).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
        tagHtml += `<div class="stat-row"><span>${escapeHtml(k)}</span><span>${v}条</span></div>`;
    })
    document.getElementById("statTag").innerHTML = tagHtml || "<p>暂无算法标签</p>";
    let ftagHtml = "";
    Object.entries(ftagCnt).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
        ftagHtml += `<div class="stat-row"><span>${escapeHtml(k)}</span><span>${v}条</span></div>`;
    })
    document.getElementById("statFeatureTag").innerHTML = ftagHtml || "<p>暂无特点标签</p>";
    const pfCnt = {};
    records.forEach(r=>pfCnt[r.platform]=(pfCnt[r.platform]||0)+1);
    let pfHtml = "";
    Object.entries(pfCnt).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
        pfHtml += `<div class="stat-row"><span>${escapeHtml(k)}</span><span>${v}条</span></div>`;
    })
    document.getElementById("statPlatform").innerHTML = pfHtml || "<p>暂无平台记录</p>";
}
function renderHeatmap(){
    if(renderLock) return;
    renderLock = true;
    const dayMap = {};
    records.forEach(r=>{
        if(!r.submitTime) return;
        const d = r.submitTime.split("T")[0];
        dayMap[d] = (dayMap[d]||0)+1;
    })
    const cells = [];
    const now = new Date();
    for(let i=364;i>=0;i--){
        const dt = new Date(now);
        dt.setDate(dt.getDate()-i);
        const ds = dt.toISOString().slice(0,10);
        const cnt = dayMap[ds] || 0;
        let lv = 0;
        if(cnt>=1) lv=1;
        if(cnt>=3) lv=2;
        if(cnt>=6) lv=3;
        if(cnt>=10) lv=4;
        if(cnt>=15) lv=5;
        cells.push(`<div class="heat-cell heat-${lv}" title="${ds}：${cnt}条提交"></div>`);
    }
    document.getElementById("heatmapBox").innerHTML = cells.join("");
    requestAnimationFrame(()=>{renderLock=false;});
}
function bindTabs(){

        tab.onclick = ()=>{

            parent.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
            tab.classList.add("active");

            const view = tab.dataset.view;
            if(type){
                document.getElementById("tab-manual").classList.toggle("hidden", type!="manual");
                document.getElementById("tab-url").classList.toggle("hidden", type!="url");
            }
            if(view){
                document.getElementById("view-records").classList.add("hidden");
                document.getElementById("view-stats").classList.add("hidden");
                document.getElementById("view-heat").classList.add("hidden");
                document.getElementById("view-wrong").classList.add("hidden");
                document.getElementById("view-solution").classList.add("hidden");
                document.getElementById(`view-${view}`).classList.remove("hidden");
                if(view==="wrong") renderWrongList();
                if(view==="heat") renderHeatmap();

async function editSolution(sid,idx){

    if(stitle===null) return;
    const scontent = prompt("修改题解正文：", rec.solutions[idx].content);
    if(scontent===null) return;
    rec.solutions[idx].title = stitle.trim();
    rec.solutions[idx].content = scontent.trim();
    await putRecord(rec);
    records = await getAllRecords();
    renderSolutionPanel();
}
async function delSolution(sid,idx){
    if(!confirm("确定删除这篇题解？")) return;
    const rec = records.find(x=>x.id===sid);
    if(!rec || !rec.solutions[idx]) return;
    rec.solutions.splice(idx,1);
    await putRecord(rec);
    records = await getAllRecords();
    renderSolutionPanel();
}
// ========== 测试点弹窗逻辑 ==========
function openTestModal(id){
    const rec = records.find(x=>x.id===id);
    if(!rec) return;
    currentTestRecordId = id;
    testState = [...(rec.testPoints || Array(TEST_COUNT_DEFAULT).fill("AC"))];
    testHistory = [];
    renderTestGrid();
    document.getElementById("testModal").classList.add("show");
}
function closeTestModal(){
    document.getElementById("testModal").classList.remove("show");
    currentTestRecordId = null;
}
function renderTestGrid(){
    const box = document.getElementById("testGridBox");
    const seq = ["AC","WA","UNK"];
    box.innerHTML = testState.map((s,i)=>{
        const cls = s==="AC"?"t-ac":s==="WA"?"t-wa":"t-unk";
        return `<div class="test-cell ${cls}" onclick="clickTest(${i})">${i+1}</div>`
    }).join("");
    const acCnt = testState.filter(x=>x==="AC").length;
    const total = testState.length;
    const rec = records.find(x=>x.id===currentTestRecordId);
    const score = rec?.totalScore||0;
    const getScore = total? (acCnt/total*score).toFixed(1):0;
    document.getElementById("testScoreInfo").innerText = `AC:${acCnt}/${total} 得分预估:${getScore}`;
}
function clickTest(idx){
    testHistory.push([...testState]);
    const order = ["AC","WA","UNK"];
    const cur = testState[idx];
    const p = order.indexOf(cur);
    testState[idx] = order[(p+1)%3];
    saveTestState();
    renderTestGrid();
}
function undoTest(){
    if(!testHistory.length) return alert("无可撤销记录");
    testState = testHistory.pop();
    saveTestState();
    renderTestGrid();
}
function resetTest(){
    if(!confirm("恢复全部测试点为AC？")) return;
    testHistory.push([...testState]);
    testState = Array(testState.length).fill("AC");
    saveTestState();
    renderTestGrid();
}
async function saveTestState(){
    const rec = records.find(x=>x.id===currentTestRecordId);
    if(!rec) return;
    rec.testPoints = [...testState];
    await putRecord(rec);
    records = await getAllRecords();
}

function exportData(){
    const payload = {records,customPlatforms};
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `oj_record_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}
async function importData(fileInput){
    const f = fileInput.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = async e=>{
        try{
            const data = JSON.parse(e.target.result);
            if(!data.records || !data.customPlatforms) return alert("文件格式不对");
            await clearRecordStore();
            for(const item of data.records) {
                if(!Array.isArray(item.featureTags)) item.featureTags = [];
                if(!Array.isArray(item.solutions)) item.solutions = [];
                await putRecord(item);
            }
            customPlatforms = data.customPlatforms;
            await setMeta("customPlatforms", customPlatforms);
            records = await getAllRecords();
            renderPlatformSelect();renderFilterOptions();renderRecords();renderWrongList();renderStats();renderHeatmap();fillSolutionSelect();
            alert("导入成功");
        }catch(err){alert("JSON解析失败");}
    }
    r.readAsText(f);
}
async function clearAll(){
    if(!confirm("确定清空全部记录和自定义平台？无法恢复！")) return;
    await clearRecordStore();
    customPlatforms = [];
    await setMeta("customPlatforms", []);
    records = [];
    renderPlatformSelect();renderFilterOptions();renderRecords();renderWrongList();renderStats();renderHeatmap();fillSolutionSelect();
}
